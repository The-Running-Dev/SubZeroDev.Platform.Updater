name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build, test, pack, and restore real sample consumers
        shell: pwsh
        run: ./scripts/Test-Package.ps1
      - name: Verify distribution formats and pinned tool
        shell: pwsh
        run: ./scripts/Pack-Application.ps1 -Project tests/UpdaterProbe/UpdaterProbe.csproj -AppId SubZeroDev.UpdaterProbe -MainExe UpdaterProbe.exe -Version 1.0.0 -ReleaseNotes README.md -OutputDirectory artifacts/probe -NuGetConfig artifacts/consumer.nuget.config
      - name: Verify packaged portable A to B to C
        shell: pwsh
        run: ./scripts/Test-PortableUpdate.ps1 -NuGetConfig artifacts/consumer.nuget.config
      - uses: actions/upload-artifact@v4
        with:
          name: packages-and-probe
          path: |
            artifacts/packages/*
            artifacts/probe/assets/*
