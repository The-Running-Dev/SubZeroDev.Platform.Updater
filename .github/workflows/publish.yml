name: Publish NuGet
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # NuGet trusted publishing exchanges the workflow's OIDC token for a short-lived API key
jobs:
  publish:
    runs-on: windows-latest
    environment: nuget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Verify release tag and license
        shell: pwsh
        run: |
          ./scripts/Assert-ReleaseTag.ps1 -Ref $env:GITHUB_REF -DefaultBranch $env:DEFAULT_BRANCH
          $version = dotnet msbuild src/SubZeroDev.Platform.Updater/SubZeroDev.Platform.Updater.csproj -getProperty:Version
          if ($LASTEXITCODE) { throw 'Could not read the package version.' }
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Run publication on the matching version tag.' }
          if (-not (Test-Path LICENSE)) { throw 'LICENSE is missing.' }
          if (-not $env:NUGET_USER) { throw 'Set the NUGET_USER variable in the nuget environment to the nuget.org account that owns the trusted publishing policy.' }
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NUGET_USER: ${{ vars.NUGET_USER }}
      - shell: pwsh
        run: ./scripts/Test-Package.ps1
      - name: Check for validation packages
        shell: pwsh
        run: if (Get-ChildItem artifacts/packages/*local-validation*) { throw 'Local validation packages must never be published.' }
      # Logged in only now: the trusted-publishing key is short-lived.
      - name: NuGet trusted publishing login
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish package and symbols to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          # dotnet nuget push does not expand this wildcard on Windows; the .snupkg beside each package is pushed with it.
          $packages = @(Get-ChildItem artifacts/packages/*.nupkg)
          if (-not $packages) { throw 'No package to publish.' }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE) { throw 'NuGet publication failed.' }
          }
